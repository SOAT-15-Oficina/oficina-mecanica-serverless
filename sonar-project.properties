sonar.projectKey=oficina-mecanica-serverless
sonar.projectName=Oficina Mecanica - Lambda de autenticacao
sonar.projectVersion=1.0.0

sonar.sourceEncoding=UTF-8
sonar.sources=cmd,internal,tools
sonar.tests=cmd,internal,tools
sonar.test.inclusions=**/*_test.go

sonar.exclusions=**/*_test.go,.git/**,.scannerwork/**,.vscode/**,.github/**,dist/**

# Fora da METRICA de cobertura -- continuam analisados para bugs e code smells.
#   cmd/**                  bootstrap do container Lambda, sem logica
#   tools/**                gerador do fixture de contrato, uso manual
#   internal/repository/**  adaptador SQL, exercitado no teste de integracao
sonar.coverage.exclusions=cmd/**,tools/**,internal/repository/**,**/*_test.go
sonar.go.coverage.reportPaths=coverage.out

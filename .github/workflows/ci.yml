name: CI

on:
  # O bring-up do repositorio de infraestrutura dispara este workflow por
  # `gh workflow run` depois de criar a camada efemera, entao ele precisa
  # aceitar disparo manual -- e o job de deploy precisa reconhecer esse
  # evento, nao so `push`.
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/adr/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/adr/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write

env:
  GO_VERSION: "1.26"
  SSM_PREFIX: /oficina-mecanica/prod

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint GitHub Actions workflows
        run: docker run --rm -v "${GITHUB_WORKSPACE}:/repo" -w /repo rhysd/actionlint:latest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Este contrato cobre apenas /auth/*. O resto da API tem contrato proprio
      # no oficina-mecanica-monolith.
      - name: Validate OpenAPI contract
        run: npx --yes @redocly/cli@1.34.5 lint auth --config redocly.yaml

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: techchallenge
          POSTGRES_PASSWORD: ${{ secrets.CI_DATABASE_PASSWORD }}
          POSTGRES_DB: techchallenge-db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U techchallenge -d techchallenge-db"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Recorte da tabela `users`; o schema completo e propriedade do
      # oficina-mecanica-monolith.
      - name: Bootstrap users table
        run: |
          PGPASSWORD='${{ secrets.CI_DATABASE_PASSWORD }}' psql \
            -h localhost -U techchallenge -d techchallenge-db \
            -v ON_ERROR_STOP=1 -f tests/bootstrap.sql

      - name: Test with coverage
        run: go test ./... -coverprofile=coverage.out -covermode=atomic
        env:
          TEST_DATABASE_URL: postgres://techchallenge:${{ secrets.CI_DATABASE_PASSWORD }}@localhost:5432/techchallenge-db

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 1

  # SonarQube self-hosted efemero, so em PR para main. Sem historico entre
  # execucoes, o Quality Gate e avaliado sobre o codigo todo.
  quality:
    if: github.event_name == 'pull_request'
    needs: [test]
    runs-on: ubuntu-latest
    services:
      sonarqube:
        image: sonarqube:lts-community
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
        ports: ["9000:9000"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: coverage

      - name: Wait for SonarQube
        run: |
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:9000/api/system/status | grep -q '"status":"UP"'; then
              exit 0
            fi
            sleep 5
          done
          echo "SonarQube nao subiu a tempo"
          exit 1

      - name: Provision scanner token
        run: |
          NEW_PASS="$(openssl rand -hex 20)"
          curl -sf -u admin:admin -X POST \
            "http://localhost:9000/api/users/change_password" \
            -d "login=admin&previousPassword=admin&password=${NEW_PASS}" >/dev/null
          TOKEN="$(curl -sf -u "admin:${NEW_PASS}" -X POST \
            "http://localhost:9000/api/user_tokens/generate" \
            -d "name=ci-${GITHUB_RUN_ID}" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          echo "SONAR_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Scan and wait for Quality Gate
        run: |
          docker run --rm --network host \
            -e SONAR_HOST_URL=http://localhost:9000 \
            -e SONAR_TOKEN="$SONAR_TOKEN" \
            -v "${GITHUB_WORKSPACE}:/usr/src" \
            sonarsource/sonar-scanner-cli:latest \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [lint, test]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # provided.al2023 espera um executavel chamado `bootstrap`.
      # arm64 = Graviton: mais barato por ms de execucao.
      - name: Build lambda artifact
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags="-s -w" -o dist/bootstrap ./cmd/lambda
          (cd dist && zip -q -X function.zip bootstrap)

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Resolve infrastructure outputs
        run: |
          NAME="$(aws ssm get-parameter --name "${SSM_PREFIX}/auth_lambda_name" \
            --query Parameter.Value --output text)"
          echo "LAMBDA_NAME=$NAME" >> "$GITHUB_ENV"

      # A funcao e criada pelo Terraform com um zip placeholder e
      # lifecycle.ignore_changes no codigo: o artefato e propriedade deste
      # pipeline, a configuracao (VPC, memoria, timeout, role) e propriedade do
      # oficina-mecanica-infrastructure.
      - name: Publish function code
        run: |
          aws lambda update-function-code \
            --function-name "$LAMBDA_NAME" \
            --zip-file fileb://dist/function.zip \
            --publish >/dev/null
          aws lambda wait function-updated --function-name "$LAMBDA_NAME"

      - name: Smoke check
        run: |
          aws lambda invoke \
            --function-name "$LAMBDA_NAME" \
            --payload '{"routeKey":"GET /rota-inexistente"}' \
            --cli-binary-format raw-in-base64-out \
            /tmp/out.json >/dev/null
          cat /tmp/out.json
          # Rota desconhecida devolve 404: prova que o binario subiu, roteou e
          # respondeu, sem depender de credencial valida no banco.
          grep -q '"statusCode":404' /tmp/out.json

services:
  lambda:
    build:
      context: ./
      dockerfile: Dockerfile
    ports:
      - "9000:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OS_INTERNAL_BASE_URL: ${OS_INTERNAL_BASE_URL:-http://host.docker.internal:8081}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-internal-token}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-dev-secret}
